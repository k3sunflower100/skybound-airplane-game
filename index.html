<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <title>하늘을 나는 조종사</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div id="game" aria-label="3D 비행기 게임 화면"></div>
    <header class="hud">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>SKYBOUND</strong><small>사막 비행 훈련</small></div></div>
      <div class="stat"><span>점수</span><strong id="score">0000</strong></div>
      <div class="stat"><span>최고 기록</span><strong id="best">0000</strong></div>
    </header>
    <div class="crosshair" aria-hidden="true"><i></i><b></b></div>
    <div class="flight-readout"><span>고도 <b id="altitude">1,200</b> m</span><span>속도 <b id="speed">240</b> km/h</span></div>
    <section class="overlay" id="overlay">
      <div class="panel">
        <div class="eyebrow">FLIGHT SIMULATOR · 01</div>
        <h1 id="title">사막 위를<br><em>날아봐요</em></h1>
        <p id="message">호주 에어즈록(울루루)과 미국의 광활한 협곡을 가로질러 링을 통과하세요.<br>터치 버튼이나 화면을 드래그해 비행기를 조종할 수 있습니다.</p>
        <div class="control-hint"><span>W A S D</span> 또는 <span>↑ ← ↓ →</span><small>키보드 조종 · 모바일은 터치 버튼/드래그</small></div>
        <button id="start-button">비행 시작 <span>→</span></button>
      </div>
    </section>
    <footer class="help"><span>WASD / 방향키</span> 조종 <i>·</i> <span>드래그 또는 터치 버튼</span> 모바일 조종 <i>·</i> <span>스페이스</span> 일시정지</footer>
    <nav class="touch-controls" aria-label="터치 비행 조종">
      <div class="touch-pad horizontal-pad" aria-label="좌우 조종">
        <button class="touch-key" data-control="left" aria-label="왼쪽으로 비행">←</button>
        <button class="touch-key" data-control="right" aria-label="오른쪽으로 비행">→</button>
      </div>
      <div class="touch-pad vertical-pad" aria-label="상하 조종">
        <button class="touch-key" data-control="up" aria-label="위로 비행">↑</button>
        <button class="touch-key" data-control="down" aria-label="아래로 비행">↓</button>
      </div>
    </nav>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
