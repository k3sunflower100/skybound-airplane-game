<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>하늘을 나는 조종사</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div id="game" aria-label="3D 비행기 게임 화면"></div>
    <header class="hud">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>SKYBOUND</strong><small>비행 훈련</small></div></div>
      <div class="stat"><span>점수</span><strong id="score">0000</strong></div>
      <div class="stat"><span>최고 기록</span><strong id="best">0000</strong></div>
    </header>
    <div class="crosshair" aria-hidden="true"><i></i><b></b></div>
    <div class="flight-readout"><span>고도 <b id="altitude">1,200</b> m</span><span>속도 <b id="speed">240</b> km/h</span></div>
    <section class="overlay" id="overlay">
      <div class="panel">
        <div class="eyebrow">FLIGHT SIMULATOR · 01</div>
        <h1 id="title">하늘을 향해<br><em>출격!</em></h1>
        <p id="message">구름 사이의 링을 통과해 점수를 모으세요.<br>오래 날수록 속도가 빨라집니다.</p>
        <div class="control-hint"><span>W A S D</span> 또는 <span>↑ ← ↓ →</span><small>비행기 조종</small></div>
        <button id="start-button">비행 시작 <span>→</span></button>
      </div>
    </section>
    <footer class="help"><span>WASD / 방향키</span> 조종 <i>·</i> <span>스페이스</span> 일시정지</footer>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
